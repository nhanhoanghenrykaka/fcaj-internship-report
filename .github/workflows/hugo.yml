name: Deploy FCAJ Hugo Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      HUGO_VERSION: 0.134.3

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install Hugo
        run: |
          curl -L -o "${{ runner.temp }}/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"

          mkdir -p "${{ runner.temp }}/hugo"

          tar -xzf "${{ runner.temp }}/hugo.tar.gz" \
            -C "${{ runner.temp }}/hugo"

          echo "${{ runner.temp }}/hugo" >> "$GITHUB_PATH"

      - name: Check Hugo Version
        run: hugo version

      - name: Build Hugo Website
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Verify Generated Image Paths
        run: python3 .github/scripts/check_generated_images.py public

      - name: Upload Website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy Website
        id: deployment
        uses: actions/deploy-pages@v4